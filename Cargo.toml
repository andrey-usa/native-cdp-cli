[package]
name = "browser-tool"
version = "0.2.0"
edition = "2021"
default-run = "browser-tool"
description = "Drive headless Chrome from the shell, one command per step: a native Rust CDP CLI for AI agents (accessibility-tree refs, sessions, tabs, iframes, dialogs) plus a JSON-lines serve mode."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "net", "macros"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
tempfile = "3"
base64 = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
