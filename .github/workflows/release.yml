name: release

# Prebuilt binaries for agents and people without a Rust toolchain:
# static Linux (musl) x86_64/aarch64, macOS arm64/x86_64 and Windows x64,
# attached to a GitHub release. install.sh / install.ps1 download the right
# one.
#
# Releasing is one tap: Actions -> release -> Run workflow on master, with
# the version from Cargo.toml (e.g. 0.3.0). The run checks that the version
# matches Cargo.toml, builds every target, then creates the tag v<version>
# on that commit and the release. No local git or token needed (the GitHub
# app works). Pushing a v* tag still works too; a tag whose version doesn't
# match Cargo.toml fails before building. Running it for a version whose
# tag already exists rebuilds that tag and replaces the release's files.

on:
  push:
    tags: ["v*"]
    # Dry run: pushing a `release-test/*` branch builds and packages every
    # target without publishing anything.
    branches: ["release-test/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, as in Cargo.toml (e.g. 0.3.0); tags this commit v<version>"
        required: true
      publish:
        description: "publish (off = dry run: build and package only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      ref: ${{ steps.p.outputs.ref }}
      publish: ${{ steps.p.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          fail() { echo "::error title=release::$1"; exit 1; }
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="v${INPUT_VERSION#v}"; publish="$INPUT_PUBLISH"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              ref="refs/tags/$tag"     # rebuild an existing release
            else
              ref="$GITHUB_SHA"
            fi
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="$GITHUB_REF_NAME"; ref="$GITHUB_REF"; publish=true
          else
            tag=""; ref="$GITHUB_REF"; publish=false   # release-test/* dry run
          fi
          if [ -n "$tag" ]; then
            have=$(git show "$ref:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
            [ "v$have" = "$tag" ] || fail "$tag does not match Cargo.toml version $have at $ref; bump Cargo.toml first"
          fi
          {
            echo "tag=$tag"; echo "ref=$ref"; echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=release plan::${tag:-dry run} from $ref (publish=$publish)"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build
        env:
          # Windows: link the C runtime statically, so the .exe runs on a
          # machine without the Visual C++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --bin navigera --target ${{ matrix.target }}
      - name: Smoke test (native targets)
        if: "!contains(matrix.target, 'x86_64-apple') || runner.arch == 'X64'"
        run: |
          bin=target/${{ matrix.target }}/release/navigera
          "$bin" --version
          "$bin" skill | head -3
      - name: Package
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/navigera-${{ matrix.target }}.tar.gz navigera
          (cd dist && shasum -a 256 navigera-${{ matrix.target }}.tar.gz > navigera-${{ matrix.target }}.tar.gz.sha256)
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/navigera-${{ matrix.target }}.zip"
          Compress-Archive -Path target/${{ matrix.target }}/release/navigera.exe -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  navigera-${{ matrix.target }}.zip" | Out-File -Encoding ascii -NoNewline "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REF: ${{ needs.plan.outputs.ref }}
        run: |
          ls -la dist
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Creates the tag on the planned commit when it doesn't exist yet.
            case "$REF" in refs/*) target="$GITHUB_SHA" ;; *) target="$REF" ;; esac
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --target "$target"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
          echo "::notice title=release::$TAG published with $(ls dist | wc -l) files: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
